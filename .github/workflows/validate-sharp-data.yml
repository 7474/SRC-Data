name: Validate Sharp Data

on: 
  push:
    paths:
      - 'Sharp/Data/**'
      - .github/workflows/validate-sharp-data.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # lint の出力（ファイル(行): error|warning: 内容）を、PR・コミットの注釈にする
    - name: Add problem matcher
      run: echo "::add-matcher::.github/matchers/src-lint.json"

    # 7474/SRC の開発版のイメージ（master にマージされるたびに入れ替わる。7474/SRC の docs/versioning.md の「開発版」）。
    # srcsharp lint で Sharp のデータを検査する。規則は SRC の仕様（src）と、GSC データパックの拡張基準の決まり（gsc-ext）。
    # 規則の「情報」は注釈にせず（matcher は error・warning だけ）、ログに出す。終了コードは error・warning で 1
    - name: Validate Data
      uses: docker://koudenpa/srcdatalinter:dev
      with:
        args: lint Sharp/Data/ --rules src,gsc-ext
