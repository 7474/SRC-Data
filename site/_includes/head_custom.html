<script>
  // Just the Docs の検索は keyup でしか動かず、日本語入力（IME）を Enter で確定したときや貼り付けでは結果が出ない。
  // 入力が確定したら keyup を送って検索させる
  (function () {
    function kick(e) {
      if (e.target && e.target.id === 'search-input') {
        e.target.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true }));
      }
    }
    document.addEventListener('input', kick);
    document.addEventListener('compositionend', kick);
  })();
</script>
