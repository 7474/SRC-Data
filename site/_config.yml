# GitHub Pages（actions/jekyll-build-pages）の設定。ページは site/build.sh で作る
title: SRC Data
description: SRC 向けのデータの閲覧と、GSC データパックの実態と比べた評価
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
lang: ja
exclude:
  - build.sh

# サイト内検索。日本語は語を空白で区切らないので、検索用の語句は作品ごとのページの front matter（search_terms）に、
# 名前と、＝・括弧などで区切った部分を空白で区切って入れている（assets/js/zzzz-search-data.json・_includes/lunr/custom-index.js）
search_enabled: true
search:
  heading_level: 1
  previews: 2
  preview_words_before: 2
  preview_words_after: 4
  tokenizer_separator: /[\s]+/
  rel_url: false
  button: false
  focus_shortcut_key: "k"

# レーダーチャート（radar-beta は Mermaid 11.6 以降）。設定は _includes/mermaid_config.js
mermaid:
  version: "12.2.0"

aux_links:
  "SRC-Data（GitHub）": "https://github.com/7474/SRC-Data"
heading_anchors: true
back_to_top: true
back_to_top_text: "先頭へ"
footer_content: "データは <a href=\"https://github.com/7474/SRC-Data\">7474/SRC-Data</a>、評価は <a href=\"https://github.com/7474/SRC/tree/master/tools\">7474/SRC の tools</a>。"

defaults:
  - scope:
      path: ""
    values:
      layout: default
